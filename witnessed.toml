# witnessed.toml for the historical sample: python-tabulate just before
# upstream commit c327d6c (2026-03-09). Only the test suite as it existed at
# that commit is used as a baseline. The "used" scripts on main target the
# later tabulate/cli.py layout and would not describe that moment honestly.

[[baselines]]
id = "tested"
kind = "tested"
cwd = "sample/tabulate"
commands = [
    ["-m", "pytest", "test", "-p", "no:cacheprovider", "-q",
     "--no-header", "--tb=no"],
]
